{% extends "dashboard/base.html" %}
{% block page_title %}{{ title }}{% endblock %}
{% block content %}
<div class="row justify-content-center">
<div class="col-lg-10">
<div class="card">
<div class="card-header">
<div>
<h3 class="card-title mb-1">{{ title }}</h3>
<div class="text-muted small">Enter client information carefully</div>
</div>
</div>
<div class="card-body p-4">
<form method="post">
{% csrf_token %}
<div class="row">
{% for field in form %}
<div class="{% if field.name == 'address' %}col-12{% else %}col-md-6{% endif %} mb-4">
<label class="form-label fw-semibold">{{ field.label }}</label>
{{ field }}
{% if field.errors %}<div class="text-danger small mt-1">{{ field.errors }}</div>{% endif %}
</div>
{% endfor %}
</div>
<div class="border-top pt-4 d-flex gap-2">
<button type="submit" class="btn btn-primary px-4">Save Client</button>
<a href="{% url 'clients' %}" class="btn btn-outline-secondary">Cancel</a>
</div>
</form>
</div>
</div>
</div>
</div>
{% endblock %}
