{% extends "dashboard/base.html" %}
{% block page_title %}Delete Client{% endblock %}
{% block content %}
<div class="row justify-content-center"><div class="col-md-7">
<div class="card"><div class="card-body text-center p-5">
<div style="font-size:50px;">⚠️</div>
<h2 style="color:#102A43;">Delete Client?</h2>
<p class="text-muted">Are you sure you want to permanently delete <strong>{{ client.full_name }}</strong>?</p>
<form method="post" class="mt-4">{% csrf_token %}
<button class="btn btn-danger">Yes, Delete Client</button>
<a href="{% url 'clients' %}" class="btn btn-outline-secondary">Cancel</a>
</form>
</div></div></div></div>
{% endblock %}
